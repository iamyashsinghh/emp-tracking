<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>capture</title>
  </head>
  <body>
    <script>
      // Hidden renderer: records exactly one chunk at a time, driven by the
      // main process. On "begin-chunk" it acquires a stream for the requested
      // source and records; on "end-chunk" (or when the chunk's time is up) it
      // stops, hands the finished WebM back to the main process, and releases
      // the stream. Recording one standalone chunk per command keeps each file
      // independently playable and lets the main process re-pick the capture
      // source (e.g. follow the active window) between chunks.
      let recorder = null;
      let stream = null;
      let current = null; // { session, seq, started, chunks }

      function pickMimeType() {
        const candidates = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
        for (const type of candidates) {
          if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
        }
        return "video/webm";
      }

      async function beginChunk(req) {
        // Never overlap chunks: if one is somehow still live, close it first.
        if (recorder || stream) cleanup();

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              mandatory: {
                chromeMediaSource: "desktop",
                chromeMediaSourceId: req.sourceId,
                maxFrameRate: req.fps,
              },
            },
          });
        } catch (e) {
          console.error("capture getUserMedia failed", e);
          // Deliver an empty chunk so the main process doesn't stall.
          deliver(req.session, req.seq, new ArrayBuffer(0), 0);
          return;
        }

        const mimeType = pickMimeType();
        current = { session: req.session, seq: req.seq, started: Date.now(), chunks: [] };

        try {
          recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: req.bitsPerSecond });
        } catch (e) {
          // Fall back to the default encoder if the bitrate/codec combo is rejected.
          recorder = new MediaRecorder(stream);
        }

        recorder.ondataavailable = (ev) => ev.data && ev.data.size > 0 && current && current.chunks.push(ev.data);
        recorder.onstop = async () => {
          const ctx = current;
          const blob = new Blob(ctx ? ctx.chunks : [], { type: "video/webm" });
          const duration = ctx ? Math.round((Date.now() - ctx.started) / 1000) : 0;
          const buf = blob.size > 0 ? await blob.arrayBuffer() : new ArrayBuffer(0);
          releaseStream();
          recorder = null;
          current = null;
          if (ctx) deliver(ctx.session, ctx.seq, buf, duration);
        };
        recorder.start();
      }

      function endChunk() {
        if (recorder && recorder.state !== "inactive") {
          recorder.stop(); // flushes, then onstop delivers the bytes
        } else {
          releaseStream();
        }
      }

      function deliver(session, seq, buffer, durationSeconds) {
        try {
          window.capture.deliverChunk(session, seq, buffer, durationSeconds);
        } catch (e) {
          console.error("capture deliverChunk failed", e);
        }
      }

      function releaseStream() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
      }

      function cleanup() {
        try {
          if (recorder && recorder.state !== "inactive") recorder.stop();
        } catch (e) {
          /* ignore */
        }
        recorder = null;
        current = null;
        releaseStream();
      }

      window.capture.onBeginChunk(beginChunk);
      window.capture.onEndChunk(endChunk);
    </script>
  </body>
</html>
