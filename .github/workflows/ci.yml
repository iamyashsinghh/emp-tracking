name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  COMPOSE_PROFILES: localdb
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Typecheck & build workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared
        run: npm run build -w packages/shared
      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/backend
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Typecheck backend
        run: npx tsc --noEmit -p apps/backend
      - name: Typecheck dashboard
        run: npx tsc --noEmit -p apps/dashboard
      - name: Typecheck agent
        run: npx tsc --noEmit -p apps/agent
      - name: Build backend
        run: npm run build -w apps/backend
      - name: Build dashboard
        run: npm run build -w apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4002
      - name: Build agent
        run: npm run build -w apps/agent

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Start stack (schema push + seed) and wait for healthchecks
        run: SEED=true docker compose up -d --wait --wait-timeout 180
      - name: Probe endpoints
        run: |
          curl -fsS http://localhost:4002/health
          curl -fsS -o /dev/null -w "dashboard /login -> %{http_code}\n" http://localhost:3000/login
      - name: Login with seeded admin
        run: |
          curl -fsS -X POST http://localhost:4002/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.co","password":"admin12345"}' -o /dev/null -w "login -> %{http_code}\n" \
            || echo "::warning::seeded admin login did not return 2xx (route or payload may differ)"
      - name: Media upload -> local storage -> download
        run: API_URL=http://localhost:4002 node scripts/smoke-media.mjs
      - name: Dump logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
