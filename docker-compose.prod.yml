# Production overlay. Used by the deploy workflow on the target host:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Images come from GHCR (set BACKEND_IMAGE / BACKEND_MIGRATE_IMAGE /
# DASHBOARD_IMAGE in the host's .env). Postgres is not published on host
# ports; put a TLS reverse proxy in front of backend/dashboard. Media is kept
# in the `mediadata` volume unless STORAGE_DRIVER=s3 (then also run --profile s3).

services:
  postgres:
    ports: !reset []
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  minio:
    # Only with STORAGE_DRIVER=s3. Bound to localhost for a reverse proxy:
    # agents upload to presigned URLs.
    ports: !override
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    logging: *logging

  migrate:
    build: !reset null
    pull_policy: always
    logging: *logging

  backend:
    build: !reset null
    pull_policy: always
    environment:
      # Must be the public API URL: agents upload media to signed links on this host.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL to the externally reachable backend URL}
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-4002}:4002"
    logging: *logging

  dashboard:
    build: !reset null
    pull_policy: always
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    logging: *logging
